services:
  localstack:
    container_name: "${LOCALSTACK_DOCKER_NAME:-localstack-main}"
    # Pinned on purpose: since 2026-03-23 newer localstack/localstack images require
    # a LocalStack account auth token. 4.14 is the last release that runs without one.
    image: localstack/localstack:4.14.0
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
    environment:
      - SERVICES=s3,dynamodb
      - DEBUG=${DEBUG:-0}
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      # Runs automatically once LocalStack is ready: creates the bucket and the table
      - "./init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh"
